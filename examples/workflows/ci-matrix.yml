# matrix の展開と、組み合わせごとに変わるステップ条件を示すサンプル。
#   - node 3種 × os 2種の直積から1組を exclude で除く
#   - include で特定の組み合わせにだけ coverage を足す
#   - runs-on と name: に matrix の値を使う
#   - if: failure() のステップは「すべて成功」を仮定するため常にスキップになる
name: CI
on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  CI: 'true'
  CACHE_PREFIX: node-${{ github.ref_name }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (node ${{ matrix.node }} / ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, macos-latest]
        exclude:
          # 古い Node は Linux だけで検証する
          - node: 18
            os: macos-latest
        include:
          # カバレッジは1つの組み合わせでだけ取る
          - node: 22
            os: ubuntu-latest
            coverage: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Upload coverage
        if: ${{ matrix.coverage }}
        run: npm run coverage
      - name: Report failure
        if: failure()
        run: echo "テストが失敗しました"

  deploy:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy.sh
